const PALETTES = {
  green:  ["#1b5e20","#2e7d32","#388e3c","#43a047","#4caf50","#66bb6a","#81c784","#a5d6a7"],
  yellow: ["#e65100","#ef6c00","#f57c00","#fb8c00","#ff9800","#ffa726","#ffb74d","#ffcc02"],
  red:    ["#7b1fa2","#8e24aa","#6a1b9a","#4a148c","#880e4f","#ad1457","#c2185b","#d81b60"],
  all:    ["#1b5e20","#e65100","#7b1fa2","#1565c0","#b71c1c","#004d40","#827717","#4a148c","#01579b","#33691e"],
};

let spinning = false;
let angle = 0;
let filtered = [];

function getFiltered() {
  const h = document.getElementById('filterHealth').value;
  const c = document.getElementById('filterCuisine').value;
  const d = document.getElementById('filterDist').value;
  return R.filter(r => {
    if (h !== 'all' && r.health !== h) return false;
    if (c !== 'all' && r.cuisine !== c) return false;
    if (d === 'close' && r.dist > 200) return false;
    if (d === 'medium' && r.dist > 400) return false;
    if (d === 'kornhill' && r.dist >= 999) return false;
    return true;
  });
}

function drawWheel(a, list) {
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const cx = 150, cy = 150, r = 146;
  ctx.clearRect(0,0,300,300);

  if (!list.length) {
    ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.fillStyle = '#f0f0f0'; ctx.fill();
    ctx.fillStyle = '#999'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('No matches', cx, cy);
    return;
  }

  const n = list.length;
  const slice = (2*Math.PI)/n;
  const hKey = document.getElementById('filterHealth').value;
  const palette = PALETTES[hKey] || PALETTES.all;

  list.forEach((item, i) => {
    const s = a + i*slice, e = s+slice;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,e); ctx.closePath();
    ctx.fillStyle = palette[i % palette.length]; ctx.fill();
    ctx.strokeStyle = '#0f0f13'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save(); ctx.translate(cx,cy); ctx.rotate(s+slice/2); ctx.textAlign='right';
    ctx.fillStyle='rgba(255,255,255,0.92)';
    const fs = n>20?7:n>14?9:n>8?10:12;
    ctx.font=`bold ${fs}px sans-serif`;
    const lbl = item.name.length>18 ? item.name.slice(0,17)+'…' : item.name;
    ctx.fillText(lbl, r-6, fs/3);
    ctx.restore();
  });

  // Center hub
  ctx.beginPath(); ctx.arc(cx,cy,26,0,2*Math.PI);
  ctx.fillStyle='#ffffff'; ctx.fill();
  ctx.strokeStyle='#ddd'; ctx.lineWidth=2; ctx.stroke();
  ctx.font='18px sans-serif'; ctx.textAlign='center'; ctx.fillText('🎰',cx,cy+6);
}

function updateUI() {
  filtered = getFiltered();
  drawWheel(angle, filtered);
  document.getElementById('countBadge').textContent = `${filtered.length} restaurant${filtered.length!==1?'s':''} in the mix`;
  document.getElementById('emptyMsg').style.display = filtered.length===0?'block':'none';
  document.getElementById('spinBtn').disabled = filtered.length===0;
  document.getElementById('resultCard').classList.remove('show');
}

function spin() {
  filtered = getFiltered();
  if (!filtered.length || spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultCard').classList.remove('show');

  const n = filtered.length;
  const slice = (2*Math.PI)/n;
  const winIdx = Math.floor(Math.random()*n);
  const spins = 6 + Math.random()*4;
  const target = angle - (winIdx*slice + slice/2 + Math.PI/2) + spins*2*Math.PI;
  const start = angle;
  const t0 = performance.now();
  const dur = 3800 + Math.random()*1200;

  function ease(t){ return 1-Math.pow(1-t,4); }

  (function frame(now){
    const t = Math.min((now-t0)/dur, 1);
    angle = start + (target-start)*ease(t);
    drawWheel(angle, filtered);
    if(t<1){ requestAnimationFrame(frame); }
    else {
      angle = ((target % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      showResult(filtered[winIdx]);
    }
  })(t0);
}

function showResult(r) {
  document.getElementById('rName').textContent = r.name;
  const ratings = [r.google?`⭐ ${r.google}`:null, r.openrice?`🍚 ${r.openrice}`:null].filter(Boolean);
  document.getElementById('rMeta').textContent = ratings.length ? ratings.join('  |  ') : 'No ratings listed';
  const hl = {green:'🟢 Healthiest',yellow:'🟡 Moderate',red:'🔴 Indulge'}[r.health];
  const hc = {green:'tag-green',yellow:'tag-yellow',red:'tag-red'}[r.health];
  const distTag = r.dist<999 ? `<span class="tag tag-purple">${r.dist}m away</span>` : `<span class="tag tag-purple">Kornhill Plaza</span>`;
  document.getElementById('rTags').innerHTML = `<span class="tag ${hc}">${hl}</span><span class="tag tag-blue">${r.cuisine}</span>${distTag}`;
  document.getElementById('rHealthy').textContent = r.healthy || '—';
  document.getElementById('rWatch').textContent = r.watch || '—';
  document.getElementById('rAddr').textContent = r.addr || '—';
  document.getElementById('rMaps').href = `https://maps.google.com/search?q=${encodeURIComponent(r.name+' '+r.addr+' Hong Kong')}`;
  document.getElementById('resultCard').classList.add('show');
}

['filterHealth','filterCuisine','filterDist'].forEach(id =>
  document.getElementById(id).addEventListener('change', updateUI)
);
updateUI();
</script>
</body>
</html>
